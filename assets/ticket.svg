<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="tTitle tDesc">
  <title id="tTitle">I.G.H. Painting work ticket</title>
  <desc id="tDesc">Type-and-SVG illustration — not a job photo. A Thornton work ticket with a house, fence, and industrial bay.</desc>
  <defs>
    <pattern id="graph" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#d9c89a" stroke-width=".6" opacity=".55"/>
