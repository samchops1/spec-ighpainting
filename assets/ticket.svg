  <text x="96" y="92" font-family="Georgia, serif" font-size="16" fill="#fff8e8">I.G.H. Painting — Knowledgeable &amp; Trustworthy</text>
  <text x="560" y="84" font-family="Arial Narrow, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#048CEF">No. 10201</text>
