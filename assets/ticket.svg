  <line x1="56" y1="22" x2="56" y2="418" stroke="#141210" stroke-width="1.5" stroke-dasharray="3 5"/>
  <rect x="68" y="36" width="608" height="368" fill="url(#graph)"/>
  <!-- header stamp -->
  <rect x="80" y="48" width="584" height="54" fill="#141210"/>
